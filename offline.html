<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — Kaouki Kite</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f172a;color:white;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px}
        .offline-box{max-width:480px}
        .offline-icon{font-size:4rem;margin-bottom:24px;opacity:0.5}
        h1{font-size:2rem;margin-bottom:12px}
        p{opacity:0.7;font-size:1.1rem;margin-bottom:24px;line-height:1.6}
        .retry-btn{display:inline-block;padding:14px 32px;background:linear-gradient(135deg,#ffb703,#fb8500);color:#1a1a1a;border-radius:50px;text-decoration:none;font-weight:700;transition:transform 0.3s}
        .retry-btn:hover{transform:translateY(-3px)}
    </style>
</head>
<body>
    <div class="offline-box">
        <div class="offline-icon">🌊</div>
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection. Don't worry — the wind will still be blowing when you're back online!</p>
        <a href="index.html" class="retry-btn" onclick="window.location.reload();return false;">Try Again</a>
    </div>
</body>
</html>
